name: COMP3104 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify README file
        run: |
          echo "Checking COMP3104 repository"
          test -f README.md
          echo "README.md exists - CI check passed"
